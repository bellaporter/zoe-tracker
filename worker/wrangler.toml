name = "zoe-api"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "zoe"
database_id = "__D1_ID__"

[triggers]
crons = ["* * * * *"]

[vars]
ALLOWED_ORIGIN = "https://bellaporter.github.io"
REQUIRE_PASSCODE = "false"
TZ_NAME = "America/Los_Angeles"
AM_MEDS_AT = "08:30"
PM_MEDS_AT = "21:00"
VAPID_SUBJECT = "https://bellaporter.github.io/zoe-tracker/"
